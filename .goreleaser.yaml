version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: aperture
    binary: aperture
    main: ./cmd/aperture
    ldflags:
      - -s -w
      - -X main.buildVersion={{.Tag}}
      - -X main.buildCommit={{.ShortCommit}}
      - -X main.buildDate={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # Darwin releases require signatures and notarization. Only snapshots
    # may skip these checks; Linux builds pass through unsigned.
    hooks:
      post:
        - cmd: 'bash scripts/sign-macos.sh "{{ .Path }}" "{{ .Target }}" "{{ .IsSnapshot }}"'
          output: true

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

    # leaving this here for when windows builds are supported
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Pushes the formula straight to the tap's default branch (no PR) once the
# signed archives are uploaded, so the sha256 values are the notarized ones.
brews:
  - name: aperture-cli
    repository:
      owner: tailscale
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/tailscale/aperture-cli
    description: Agentic coding launcher for Aperture by Tailscale
    license: BSD-3-Clause
    commit_author:
      use_github_app_token: true
    test: |
      assert_match version.to_s, shell_output("#{bin}/aperture --version")
