version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: aperture
    binary: aperture
    main: ./cmd/aperture
    ldflags:
      - -s -w
      - -X main.buildVersion={{.Tag}}
      - -X main.buildCommit={{.ShortCommit}}
      - -X main.buildDate={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Darwin releases require signatures and notarization. Only snapshots
    # may skip these checks; Linux and Windows builds pass through unsigned.
    hooks:
      post:
        - cmd: 'bash scripts/sign-macos.sh "{{ .Path }}" "{{ .Target }}" "{{ .IsSnapshot }}"'
          output: true

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

    # Windows users expect a zip.
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Pushes the cask straight to the tap's default branch (no PR) once the
# signed archives are uploaded, so the sha256 values are the notarized ones.
# The cask also covers the unsigned Linux archives, so the preflight step that
# re-verifies the Developer ID signature and notarization is macOS-only.
homebrew_casks:
  - name: aperture
    binaries:
      - aperture
    repository:
      owner: tailscale
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/tailscale/aperture-cli
    description: Launch AI coding agents through Tailscale Aperture
    commit_author:
      use_github_app_token: true
    hooks:
      pre:
        install_steps: |
          on_macos do
            run "/usr/bin/codesign",
                args:           [
                  "--verify", "--strict", "--check-notarization", "-R",
                  '=anchor apple generic and identifier "aperture" and certificate leaf[subject.OU] = "W5364U7YZB"',
                  "{{ .StagedPath }}/aperture"
                ],
                network_access: true
          end
