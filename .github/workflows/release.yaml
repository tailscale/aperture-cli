name: release-on-tag

on:
  push:
    tags:
      - '*'

  # Allows manual triggering of the workflow
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag release (e.g. v1.2.3)'
        required: true

permissions:
  contents: write
  # google-github-actions/auth exchanges the run's OIDC token for a Google access token.
  id-token: write

jobs:
  # One macOS job builds everything: the linux binaries cross-compile with CGO off, and the darwin and windows hooks sign before archiving (darwin also notarizes).
  goreleaser:
    runs-on: macos-latest
    timeout-minutes: 60
    # The workload identity provider's attribute condition trusts this
    # environment. A ref-based condition would match a different tag each run.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      -
        name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      -
        name: Log in to Google Cloud
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      -
        name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      -
        name: Set up Windows signing
        run: bash scripts/setup-windows-signing.sh
      -
        name: Set up signing keychain and notary credentials
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: bash scripts/setup-macos-signing.sh
      -
        name: Mint tap token
        id: tap-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: tailscale
          repositories: homebrew-tap
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a #v6.4.0
        with:
          distribution: goreleaser
          version: '~> v2.19'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN is scoped to this repo only; the tap needs the App token.
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
          # scripts/sign-windows.sh reads the Windows key store from here. The
          # ci-windows-signing workflow runs the same hook with PKCS12 and a
          # throwaway key; this is the line that differs.
          WINDOWS_SIGN_STORETYPE: GOOGLECLOUD
          WINDOWS_SIGN_KEYSTORE: ${{ vars.GCP_KMS_KEYRING }}
          WINDOWS_SIGN_ALIAS: ${{ vars.GCP_KMS_KEY }}
          WINDOWS_SIGN_CERTFILE: scripts/windows-codesign-chain.pem
          WINDOWS_SIGN_STOREPASS: ${{ steps.gcp.outputs.access_token }}
      -
        name: Tear down signing keychain
        if: always()
        run: security delete-keychain "$SIGNING_KEYCHAIN"

  # Reads the published Windows zips back and asks Windows itself whether the
  # signature is valid, timestamped and ours. The goreleaser job cannot: the
  # trust store that matters is Windows'.
  verify-windows:
    needs: goreleaser
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Download Windows archives
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*_windows_*.zip'
      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $zips = Get-ChildItem -Filter '*_windows_*.zip'
          if ($zips.Count -ne 2) { throw "expected 2 Windows archives, found $($zips.Count)" }
          $exes = foreach ($zip in $zips) {
            $dir = Join-Path $env:RUNNER_TEMP $zip.BaseName
            Expand-Archive -Path $zip.FullName -DestinationPath $dir
            Join-Path $dir 'aperture.exe'
          }
          ./scripts/verify-windows-signature.ps1 -SignerPattern 'O=Tailscale Inc\.' -Path $exes
