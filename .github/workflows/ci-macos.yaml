name: macOS CI

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  # Allows manual triggering of the workflow
  workflow_dispatch:

jobs:
  run-tests:
    name: Go ${{ matrix.go-version }}
    runs-on: macos-latest
    strategy:
      matrix:
        go-version: ["1.26.10", "1.27.x"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go-version }}

      # Linux CI never compiles the darwin-only files, so this is the only
      # gate they get before a release build on macOS.
      - name: Check
        run: make check
