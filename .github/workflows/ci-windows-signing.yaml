name: Windows signing

# Proves the release signing and packaging path end to end with a throwaway
# self-signed key: the same setup, hook and MSI scripts the release runs, then
# Windows' own verdict on the result and a real install, upgrade and uninstall
# of the MSI. What it cannot prove is trust in the production CA; the
# release's windows-msi job does that.
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/ci-windows-signing.yaml"
      - ".goreleaser.yaml"
      - "installer/**"
      - "scripts/*windows*"
      - "scripts/*selfsigned*"
      - "scripts/*wix*"

  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/ci-windows-signing.yaml"
      - ".goreleaser.yaml"
      - "installer/**"
      - "scripts/*windows*"
      - "scripts/*selfsigned*"
      - "scripts/*wix*"

  # Allows manual triggering of the workflow
  workflow_dispatch:

jobs:
  sign-and-verify:
    # Each architecture on its own hardware, because an MSI installs only on
    # the platform it names.
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Exports JSIGN_JAR and the readiness flag to the steps below, exactly
      # as it does in the release.
      - name: Set up Windows signing
        shell: bash
        run: bash scripts/setup-windows-signing.sh

      - name: Set up WiX
        shell: bash
        run: bash scripts/setup-wix.sh

      # The release order: sign the exe, package it, sign the MSI. Two
      # versions so the install test can upgrade one to the other, and a
      # second build of the newer one, as a re-run release job would make.
      - name: Build, sign and package with a self-signed key
        shell: bash
        env:
          CGO_ENABLED: "0"
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP//\\//}/signing-smoke"
          password=$(openssl rand -hex 16)
          echo "::add-mask::$password"
          CODESIGN_P12_PASSWORD="$password" bash scripts/make-selfsigned-codesign.sh "$work"
          export WINDOWS_SIGN_STORETYPE=PKCS12
          export WINDOWS_SIGN_KEYSTORE="$work/codesign.p12"
          export WINDOWS_SIGN_STOREPASS="$password"
          GOOS=windows GOARCH=$ARCH go build -ldflags '-s -w' -o "$work/aperture.exe" ./cmd/aperture
          bash scripts/sign-windows.sh "$work/aperture.exe" "windows_$ARCH" false
          for name in v0.0.1 v0.0.2 v0.0.2-rebuild; do
            bash scripts/build-windows-msi.sh "$work/aperture.exe" "${name%-rebuild}" "$ARCH" "$work/aperture-$name.msi"
            bash scripts/sign-windows.sh "$work/aperture-$name.msi" "windows_$ARCH" false
          done
          echo "WORK=$work" >> "$GITHUB_ENV"

      # The runner is an administrator, so the throwaway certificate can be
      # trusted for the length of the job and Windows can answer Valid.
      - name: Verify with Windows
        shell: pwsh
        run: |
          Import-Certificate -FilePath "$env:WORK/codesign.crt" -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          ./scripts/verify-windows-signature.ps1 -SignerPattern 'CN=Aperture Test Signing' -Path @(
            "$env:WORK/aperture.exe", "$env:WORK/aperture-v0.0.1.msi", "$env:WORK/aperture-v0.0.2.msi")

      - name: Install, upgrade, reinstall and uninstall
        shell: pwsh
        run: |
          ./scripts/test-windows-msi-install.ps1 `
            -Old "$env:WORK/aperture-v0.0.1.msi" -OldVersion 0.0.1 `
            -New "$env:WORK/aperture-v0.0.2.msi" -NewVersion 0.0.2 `
            -Rebuild "$env:WORK/aperture-v0.0.2-rebuild.msi"
