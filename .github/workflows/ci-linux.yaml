name: Linux CI

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  # Allows manual triggering of the workflow
  workflow_dispatch:

jobs:
  run-tests:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26.10", "1.27.x"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go-version }}

      # The Makefile is the one definition of the gate, so a green local
      # `make check` means a green CI. The formatting check that used to be
      # inlined here lives in `make lint`, which check depends on.
      - name: Check
        run: make check

  blackbox:
    name: Black-box (tailnet tag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.10"

      # The tagged suites degrade without a tailnet: contract needs nothing
      # external, compat's state-read half needs only GitHub, and the
      # bridge-login half skips. A TS_AUTHKEY secret enables that half.
      - name: Black-box suites
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: make test-tailnet
